name: Build NodeShare Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# =========================================================
# WINDOWS EXE
# =========================================================

jobs:
  build-windows:
    name: Build NodeShare Windows EXE
    runs-on: windows-latest

    steps:
      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Node.js
      # ---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # ---------------------------------------------------
      # Verify project files
      # ---------------------------------------------------
      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            Write-Error "package.json not found."
            exit 1
          }

          if (!(Test-Path "package-lock.json")) {
            Write-Error "package-lock.json not found. Run npm install locally/Codespaces and commit package-lock.json."
            exit 1
          }

          Write-Host "package.json found."
          Write-Host "package-lock.json found."

      # ---------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------
      - name: Install Node dependencies
        run: npm ci

      # ---------------------------------------------------
      # Build Windows application
      # ---------------------------------------------------
      - name: Build Windows EXE
        run: npm run build:win

      # ---------------------------------------------------
      # Verify Windows output
      # ---------------------------------------------------
      - name: Verify Windows build
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            Write-Error "dist directory was not created."
            exit 1
          }

          $files = Get-ChildItem "dist" -Recurse -File |
            Where-Object {
              $_.Extension -eq ".exe"
            }

          if ($files.Count -eq 0) {
            Write-Error "No Windows EXE was produced."
            exit 1
          }

          Write-Host "Windows build successful:"
          $files | ForEach-Object {
            Write-Host $_.FullName
          }

      # ---------------------------------------------------
      # Upload Windows artifacts
      # ---------------------------------------------------
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Windows
          path: |
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/latest*.yml
          if-no-files-found: error

  # =========================================================
  # ANDROID APK
  # =========================================================

  build-android:
    name: Build NodeShare Android APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Node.js
      # ---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # ---------------------------------------------------
      # Java
      # ---------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ---------------------------------------------------
      # Android SDK
      # ---------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------
      # Verify project files
      # ---------------------------------------------------
      - name: Verify project
        shell: bash
        run: |
          test -f package.json || {
            echo "package.json not found"
            exit 1
          }

          test -f package-lock.json || {
            echo "package-lock.json not found"
            exit 1
          }

          test -f android/gradlew || {
            echo "android/gradlew not found"
            exit 1
          }

          test -f android/app/build.gradle || {
            echo "android/app/build.gradle not found"
            exit 1
          }

          echo "Project structure OK."

      # ---------------------------------------------------
      # Install Node dependencies
      # ---------------------------------------------------
      - name: Install Node dependencies
        run: npm ci

      # ---------------------------------------------------
      # Android local.properties
      # ---------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      # ---------------------------------------------------
      # Gradle permission
      # ---------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ---------------------------------------------------
      # Clean previous Android build
      # ---------------------------------------------------
      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean --no-daemon

      # ---------------------------------------------------
      # Build release APK
      # ---------------------------------------------------
      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ---------------------------------------------------
      # Verify APK
      # ---------------------------------------------------
      - name: Verify Android APK
        shell: bash
        run: |
          APK_COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APK was produced."
            exit 1
          fi

          echo "Android APK build successful."

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      # ---------------------------------------------------
      # Upload APK
      # ---------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
