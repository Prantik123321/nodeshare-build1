name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔧 Setup JavaFX
        run: |
          echo "Downloading JavaFX SDK..."
          curl -L -o javafx.zip https://gluonhq.com/download/javafx-21-windows-sdk/
          unzip -q javafx.zip -d C:\
          mv C:\javafx-sdk-21.0.1 C:\javafx-sdk-21
          echo "JAVA_HOME=C:\javafx-sdk-21" >> $env:GITHUB_ENV
        shell: pwsh

      - name: 📦 Build with Maven
        run: mvn clean package
        env:
          JAVA_TOOL_OPTIONS: -Dorg.slf4j.simpleLogger.defaultLogLevel=error

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-JAR
          path: target/*.jar

      - name: 📤 Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Windows
          path: target/*.exe
