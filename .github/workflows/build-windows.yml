name: 🚀 Build Portable Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build NodeShare
    runs-on: windows-latest

    steps:
      # =========================================================
      # 1. CHECKOUT CODE
      # =========================================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # =========================================================
      # 2. SETUP JAVA 21
      # =========================================================
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # =========================================================
      # 3. DOWNLOAD JAVAFX
      # =========================================================
      - name: 📦 Download JavaFX SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "📥 Downloading JavaFX SDK..." -ForegroundColor Cyan

          $url = "https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_windows-x64_bin-sdk.zip"
          $zip = "$env:RUNNER_TEMP\javafx.zip"
          $extract = "$env:RUNNER_TEMP\javafx"

          # Download
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host "✅ Downloaded JavaFX SDK"

          # Extract
          Write-Host "📂 Extracting JavaFX..."
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          # Find the folder
          $javafxFolder = Get-ChildItem -Path $extract -Directory | Where-Object { $_.Name -match "javafx-sdk" } | Select-Object -First 1
          if (-not $javafxFolder) {
              Write-Host "❌ JavaFX SDK folder not found." -ForegroundColor Red
              Get-ChildItem $extract -Recurse
              exit 1
          }

          # Move to C:\
          $javafxPath = "C:\javafx-sdk-21"
          if (Test-Path $javafxPath) { Remove-Item $javafxPath -Recurse -Force }
          Move-Item -Path $javafxFolder.FullName -Destination $javafxPath

          if (-not (Test-Path "$javafxPath\lib")) {
              Write-Host "❌ JavaFX lib folder not found." -ForegroundColor Red
              exit 1
          }

          Write-Host "✅ JavaFX installed at: $javafxPath" -ForegroundColor Green

      # =========================================================
      # 4. BUILD JAR
      # =========================================================
      - name: 📦 Build JAR with dependencies
        shell: cmd
        env:
          JAVA_TOOL_OPTIONS: "--module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml"
        run: |
          echo "🔨 Building Java application..."
          mvn clean compile
          if errorlevel 1 exit /b 1
          mvn package assembly:single
          if errorlevel 1 exit /b 1
          echo "✅ Build successful!"
          dir target

      # =========================================================
      # 5. FIND JAR
      # =========================================================
      - name: 🔍 Find application JAR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "🔍 Searching for application JAR..." -ForegroundColor Cyan

          $jars = Get-ChildItem -Path "target" -Filter "*.jar" -File | Where-Object {
              $_.Name -notmatch "sources|javadoc|original-"
          }

          if ($jars.Count -eq 0) {
              Write-Host "❌ No JAR found!" -ForegroundColor Red
              Get-ChildItem target -Recurse
              exit 1
          }

          Write-Host "📄 JAR files found:"
          $jars | ForEach-Object { Write-Host "  - $($_.Name)" }

          # Prefer fat JAR
          $appJar = $jars | Where-Object { $_.Name -match "jar-with-dependencies|all|fat|uber" } | Select-Object -First 1
          if (-not $appJar) { $appJar = $jars | Select-Object -Last 1 }

          Write-Host "✅ Selected: $($appJar.Name)" -ForegroundColor Green
          "APP_JAR=$($appJar.FullName)" >> $env:GITHUB_ENV
          "APP_JAR_NAME=$($appJar.Name)" >> $env:GITHUB_ENV

      # =========================================================
      # 6. CREATE PORTABLE EXE
      # =========================================================
      - name: 🪟 Create Portable Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "🪟 Creating portable Windows EXE..." -ForegroundColor Cyan

          $output = "target\portable"
          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          Write-Host "📦 JAR: $env:APP_JAR_NAME"
          Write-Host "📂 Output: $output"

          jpackage `
            --type app-image `
            --name NodeShare `
            --input target `
            --main-jar "$env:APP_JAR_NAME" `
            --main-class com.prantik.nodeshare.NodeShareApp `
            --module-path "C:\javafx-sdk-21\lib" `
            --add-modules "javafx.controls,javafx.fxml" `
            --dest "$output" `
            --app-version "1.0.0" `
            --vendor "Prantik" `
            --description "NodeShare - Share and discover knowledge"

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ jpackage failed!" -ForegroundColor Red
              exit 1
          }

          $exe = "$output\NodeShare\NodeShare.exe"
          if (-not (Test-Path $exe)) {
              Write-Host "❌ NodeShare.exe not created!" -ForegroundColor Red
              exit 1
          }

          Write-Host "✅ NodeShare.exe created successfully!" -ForegroundColor Green
          Write-Host "📍 $exe"

      # =========================================================
      # 7. CREATE ZIP
      # =========================================================
      - name: 🗜️ Create Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "🗜️ Creating ZIP archive..." -ForegroundColor Cyan

          $source = "target\portable\NodeShare"
          $zip = "target\NodeShare-Portable-Windows.zip"

          if (Test-Path $zip) { Remove-Item $zip -Force }

          Compress-Archive -Path $source -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              Write-Host "❌ ZIP creation failed!" -ForegroundColor Red
              exit 1
          }

          Write-Host "✅ ZIP created: $zip" -ForegroundColor Green

      # =========================================================
      # 8. UPLOAD ARTIFACTS
      # =========================================================
      - name: 📤 Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Windows
          path: target/NodeShare-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload Portable Folder
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Folder
          path: target/portable/NodeShare
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-JAR
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
