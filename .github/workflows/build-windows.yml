name: Build Portable EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Download JavaFX
        run: |
          curl -L -o javafx.zip https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_windows-x64_bin-sdk.zip
          unzip -q javafx.zip -d C:\
          mv C:\openjfx-* C:\javafx-sdk-21
        shell: bash

      - name: Build JAR
        run: |
          mvn clean compile
          mvn package
        shell: cmd
        env:
          JAVA_TOOL_OPTIONS: --module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml

      - name: Create EXE
        run: |
          cd target
          for %%f in (*.jar) do (
            echo Creating EXE from: %%f
            jpackage --type app-image --name NodeShare --input . --main-jar "%%f" --main-class com.prantik.nodeshare.NodeShareApp --dest portable --java-options "--module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml"
            goto :done
          )
          :done
        shell: cmd

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare
          path: target/portable/NodeShare
