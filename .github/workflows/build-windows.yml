name: Build Portable Windows EXE

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build NodeShare for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download JavaFX SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_windows-x64_bin-sdk.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'javafx.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'javafx'
          $javafxPath = 'C:\javafx-sdk-21'

          Write-Host 'Downloading JavaFX SDK...'
          Invoke-WebRequest -Uri $url -OutFile $zip

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $javafxFolder = Get-ChildItem -Path $extract -Directory |
            Where-Object { $_.Name -like 'javafx-sdk-*' } |
            Select-Object -First 1

          if (-not $javafxFolder) {
            Write-Error 'JavaFX SDK folder was not found.'
          }

          if (Test-Path $javafxPath) {
            Remove-Item $javafxPath -Recurse -Force
          }

          Move-Item -Path $javafxFolder.FullName -Destination $javafxPath

          if (-not (Test-Path (Join-Path $javafxPath 'lib'))) {
            Write-Error 'JavaFX lib folder was not found.'
          }

          Write-Host "JavaFX installed at $javafxPath"

      - name: Build JAR
        shell: cmd
        env:
          JAVA_TOOL_OPTIONS: "--module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml"
        run: |
          echo Building NodeShare JAR...
          mvn clean package
          if errorlevel 1 exit /b 1
          if not exist target\nodeshare.jar (
            echo ERROR: target\nodeshare.jar was not created.
            dir target
            exit /b 1
          )
          echo JAR build successful.

      - name: Create Portable Windows App
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $output = 'target\portable'
          $jar = 'target\nodeshare.jar'

          if (Test-Path $output) {
            Remove-Item $output -Recurse -Force
          }

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          if (-not (Test-Path $jar)) {
            Write-Error 'target\nodeshare.jar does not exist.'
          }

          Write-Host 'Creating portable Windows application...'

          jpackage `
            --type app-image `
            --name NodeShare `
            --input target `
            --main-jar nodeshare.jar `
            --main-class com.prantik.nodeshare.NodeShareApp `
            --module-path 'C:\javafx-sdk-21\lib' `
            --add-modules 'javafx.controls,javafx.fxml' `
            --dest $output `
            --app-version '1.0.0' `
            --vendor 'Prantik' `
            --description 'NodeShare - Share and discover knowledge'

          if ($LASTEXITCODE -ne 0) {
            Write-Error 'jpackage failed.'
          }

          $exe = Join-Path $output 'NodeShare\NodeShare.exe'

          if (-not (Test-Path $exe)) {
            Write-Error 'NodeShare.exe was not created.'
          }

          Write-Host "Portable EXE created: $exe"

      - name: Verify Portable App Files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $appDir = 'target\portable\NodeShare'
          $exe = Join-Path $appDir 'NodeShare.exe'
          $runtime = Join-Path $appDir 'runtime'

          if (-not (Test-Path $exe)) {
            Write-Error 'NodeShare.exe is missing.'
          }

          if (-not (Test-Path $runtime)) {
            Write-Error 'Bundled Java runtime is missing.'
          }

          Write-Host 'Portable app verification passed.'
          Write-Host "EXE size: $((Get-Item $exe).Length) bytes"

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = 'target\portable\NodeShare'
          $zip = 'target\NodeShare-Portable-Windows.zip'

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path $source -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            Write-Error 'Portable ZIP was not created.'
          }

          Write-Host "Created: $zip"

      - name: Upload Portable Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Windows
          path: target/NodeShare-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Folder
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Folder
          path: target/portable/NodeShare
          if-no-files-found: error
          retention-days: 30

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-JAR
          path: target/nodeshare.jar
          if-no-files-found: error
          retention-days: 30
