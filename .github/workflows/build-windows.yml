name: Build Portable Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build NodeShare Portable
    runs-on: windows-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # =========================================================
      # JAVAFX SDK
      # =========================================================
      - name: Download JavaFX SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_windows-x64_bin-sdk.zip"
          $zip = "$env:RUNNER_TEMP\javafx.zip"
          $extract = "$env:RUNNER_TEMP\javafx"
          $javafxPath = "C:\javafx-sdk-21"

          Write-Host "Downloading JavaFX SDK..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            Write-Host "JavaFX download failed."
            exit 1
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $javafxFolder = Get-ChildItem `
            -Path $extract `
            -Directory |
            Where-Object {
              $_.Name -like "javafx-sdk-*"
            } |
            Select-Object -First 1

          if (-not $javafxFolder) {
            Write-Host "JavaFX SDK folder not found."
            Get-ChildItem $extract -Recurse
            exit 1
          }

          if (Test-Path $javafxPath) {
            Remove-Item $javafxPath -Recurse -Force
          }

          Move-Item `
            -Path $javafxFolder.FullName `
            -Destination $javafxPath

          if (-not (Test-Path "$javafxPath\lib")) {
            Write-Host "JavaFX lib folder not found."
            exit 1
          }

          Write-Host "JavaFX installed successfully."
          Write-Host "Location: $javafxPath"

      # =========================================================
      # BUILD JAR
      # =========================================================
      - name: Build NodeShare JAR
        shell: cmd
        env:
          JAVA_TOOL_OPTIONS: "--module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml"
        run: |
          echo ========================================
          echo Building NodeShare
          echo ========================================

          mvn clean package

          if errorlevel 1 (
            echo.
            echo Maven build FAILED.
            exit /b 1
          )

          echo.
          echo Maven build completed successfully.
          echo.
          echo TARGET CONTENT:
          dir target

      # =========================================================
      # VERIFY JAR
      # =========================================================
      - name: Verify NodeShare JAR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jar = "target\nodeshare.jar"

          if (-not (Test-Path $jar)) {
            Write-Host "ERROR: target\nodeshare.jar was not found."
            Write-Host ""
            Write-Host "Files inside target:"
            Get-ChildItem "target" -Recurse
            exit 1
          }

          Write-Host "NodeShare JAR found."
          Write-Host "Path: $jar"
          Write-Host "Size: $((Get-Item $jar).Length) bytes"

      # =========================================================
      # CREATE PORTABLE APP
      # =========================================================
      - name: Create Portable Windows Application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = "target\portable"

          Write-Host "Creating portable application..."

          if (Test-Path $output) {
            Remove-Item $output -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $output `
            -Force | Out-Null

          jpackage `
            --type app-image `
            --name NodeShare `
            --input target `
            --main-jar nodeshare.jar `
            --main-class com.prantik.nodeshare.NodeShareApp `
            --module-path "C:\javafx-sdk-21\lib" `
            --add-modules "javafx.controls,javafx.fxml" `
            --dest "$output" `
            --app-version "1.0.0" `
            --vendor "Prantik" `
            --description "NodeShare"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "jpackage FAILED."
            exit 1
          }

          $appDir = "$output\NodeShare"
          $exe = "$appDir\NodeShare.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: NodeShare.exe was not created."
            Get-ChildItem $output -Recurse
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Portable EXE created successfully!"
          Write-Host "========================================"
          Write-Host "EXE: $exe"

      # =========================================================
      # VERIFY PORTABLE RUNTIME
      # =========================================================
      - name: Verify Bundled Java Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appDir = "target\portable\NodeShare"
          $exe = "$appDir\NodeShare.exe"
          $runtime = "$appDir\runtime"

          if (-not (Test-Path $exe)) {
            Write-Host "NodeShare.exe is missing."
            exit 1
          }

          if (-not (Test-Path $runtime)) {
            Write-Host "Bundled Java runtime is missing."
            exit 1
          }

          Write-Host "EXE verified."
          Write-Host "Bundled Java runtime verified."

          Write-Host ""
          Write-Host "Portable application contents:"
          Get-ChildItem $appDir

      # =========================================================
      # CREATE ZIP
      # =========================================================
      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "target\portable\NodeShare"
          $zip = "target\NodeShare-Portable-Windows.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path $source `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            Write-Host "ZIP creation failed."
            exit 1
          }

          Write-Host ""
          Write-Host "Portable ZIP created successfully."
          Write-Host "ZIP: $zip"
          Write-Host "Size: $((Get-Item $zip).Length) bytes"

      # =========================================================
      # UPLOAD PORTABLE ZIP
      # =========================================================
      - name: Upload Portable Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Windows
          path: target/NodeShare-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # UPLOAD PORTABLE FOLDER
      # =========================================================
      - name: Upload Portable Application Folder
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Folder
          path: target/portable/NodeShare
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # UPLOAD JAR
      # =========================================================
      - name: Upload NodeShare JAR
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-JAR
          path: target/nodeshare.jar
          if-no-files-found: error
          retention-days: 30
