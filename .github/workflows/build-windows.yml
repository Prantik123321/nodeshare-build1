name: Build Portable Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build NodeShare
    runs-on: windows-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download JavaFX SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_windows-x64_bin-sdk.zip"
          $zip = "$env:RUNNER_TEMP\javafx.zip"
          $extract = "$env:RUNNER_TEMP\javafx"
          $javafxPath = "C:\javafx-sdk-21"

          Write-Host "Downloading JavaFX SDK..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $javafxFolder = Get-ChildItem `
            -Path $extract `
            -Directory |
            Where-Object { $_.Name -like "javafx-sdk-*" } |
            Select-Object -First 1

          if (-not $javafxFolder) {
            Write-Host "JavaFX SDK folder not found."
            Get-ChildItem $extract -Recurse
            exit 1
          }

          if (Test-Path $javafxPath) {
            Remove-Item $javafxPath -Recurse -Force
          }

          Move-Item `
            -Path $javafxFolder.FullName `
            -Destination $javafxPath

          if (-not (Test-Path "$javafxPath\lib")) {
            Write-Host "JavaFX lib folder not found."
            exit 1
          }

          Write-Host "JavaFX installed successfully."

      - name: Build JAR
        shell: cmd
        env:
          JAVA_TOOL_OPTIONS: "--module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml"
        run: |
          echo Building NodeShare...

          mvn clean compile

          if errorlevel 1 (
            echo Maven compile failed.
            exit /b 1
          )

          mvn package assembly:single

          if errorlevel 1 (
            echo Maven package failed.
            exit /b 1
          )

          echo Build completed.

          dir target

      - name: Find application JAR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jars = @(
            Get-ChildItem `
              -Path "target" `
              -Filter "*.jar" `
              -File |
            Where-Object {
              $_.Name -notmatch "sources" -and
              $_.Name -notmatch "javadoc" -and
              $_.Name -notmatch "^original-"
            }
          )

          if ($jars.Count -eq 0) {
            Write-Host "No application JAR found."
            Get-ChildItem target -Recurse
            exit 1
          }

          Write-Host "JAR files found:"

          foreach ($jar in $jars) {
            Write-Host " - $($jar.Name)"
          }

          $appJar = $jars |
            Where-Object {
              $_.Name -match "jar-with-dependencies|all|fat|uber"
            } |
            Select-Object -First 1

          if (-not $appJar) {
            $appJar = $jars |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          Write-Host "Selected JAR: $($appJar.Name)"

          "APP_JAR_NAME=$($appJar.Name)" >> $env:GITHUB_ENV

      - name: Create Portable Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = "target\portable"

          if (Test-Path $output) {
            Remove-Item $output -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $output `
            -Force | Out-Null

          Write-Host "Creating NodeShare portable application..."

          jpackage `
            --type app-image `
            --name NodeShare `
            --input target `
            --main-jar "$env:APP_JAR_NAME" `
            --main-class com.prantik.nodeshare.NodeShareApp `
            --module-path "C:\javafx-sdk-21\lib" `
            --add-modules "javafx.controls,javafx.fxml" `
            --dest "$output" `
            --app-version "1.0.0" `
            --vendor "Prantik" `
            --description "NodeShare - Share and discover knowledge"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "jpackage failed."
            exit 1
          }

          $exe = "$output\NodeShare\NodeShare.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "NodeShare.exe was not created."
            Get-ChildItem $output -Recurse
            exit 1
          }

          Write-Host "NodeShare.exe created successfully."
          Write-Host $exe

      - name: Test Portable EXE
        shell: pwsh
        run: |
          $exe = "target\portable\NodeShare\NodeShare.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "EXE not found."
            exit 1
          }

          Write-Host "EXE exists successfully."
          Write-Host "Size: $((Get-Item $exe).Length) bytes"

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "target\portable\NodeShare"
          $zip = "target\NodeShare-Portable-Windows.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path $source `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            Write-Host "ZIP creation failed."
            exit 1
          }

          Write-Host "Portable ZIP created successfully."

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Windows
          path: target/NodeShare-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Folder
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable-Folder
          path: target/portable/NodeShare
          if-no-files-found: error
          retention-days: 30

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-JAR
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
