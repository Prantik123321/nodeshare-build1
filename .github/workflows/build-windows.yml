name: Build Portable Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 📦 Download JavaFX SDK
        run: |
          echo "Downloading JavaFX SDK..."
          Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_windows-x64_bin-sdk.zip" -OutFile "javafx.zip"
          Expand-Archive -Path "javafx.zip" -DestinationPath "C:\" -Force
          
          # Find the extracted folder
          $folder = Get-ChildItem -Path "C:\" -Directory | Where-Object { $_.Name -match "openjfx|javafx-sdk" } | Select-Object -First 1
          if ($folder) {
              Move-Item -Path $folder.FullName -Destination "C:\javafx-sdk-21" -Force
              echo "✅ JavaFX installed at C:\javafx-sdk-21"
          } else {
              echo "❌ Could not find JavaFX folder"
              Get-ChildItem -Path "C:\"
              exit 1
          }
        shell: pwsh

      - name: 📦 Build JAR with dependencies
        run: |
          echo "Building JAR..."
          mvn clean compile
          mvn package assembly:single
        shell: cmd
        env:
          JAVA_TOOL_OPTIONS: --module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml

      - name: 📦 Create Portable EXE
        run: |
          echo "Creating portable EXE..."
          jpackage `
            --type app-image `
            --name NodeShare `
            --input target `
            --main-jar nodeshare.jar `
            --main-class com.prantik.nodeshare.NodeShareApp `
            --dest target/portable `
            --win-dir-chooser `
            --win-shortcut `
            --win-menu `
            --java-options "--module-path=C:\javafx-sdk-21\lib --add-modules=javafx.controls,javafx.fxml"
        shell: pwsh

      - name: 📤 Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-Portable
          path: target/portable/NodeShare

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NodeShare-JAR
          path: target/nodeshare.jar
